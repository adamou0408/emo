<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EE">
  <title>情緒小夥伴</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <main id="view" tabindex="-1"></main>

    <nav class="tabs" aria-label="主要選單">
      <button type="button" class="tab" data-tab="home">開門</button>
      <button type="button" class="tab" data-tab="history">記錄</button>
    </nav>
  </div>

  <dialog id="rename-dialog" aria-labelledby="rename-title">
    <form method="dialog" id="rename-form">
      <h2 id="rename-title">幫他取個名字</h2>
      <p class="hint" id="rename-hint"></p>
      <input id="rename-input" type="text" maxlength="8" autocomplete="off" aria-labelledby="rename-title">
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="rename-reset">用原本的名字</button>
        <button type="button" class="btn ghost" id="rename-cancel">取消</button>
        <button type="submit" class="btn primary">儲存</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
